# KO Stage3 SELECT v3 — gate-conditioned differentiation vs Blind/Scratch
model_name: Qwen/Qwen3.5-9B
dtype: bf16
stage1_lora_dir: outputs/qwen35_9b/stage1_en/lora
gates_file: outputs/qwen35_9b_v3/stage2_gates/gates.json
output_dir: outputs/qwen35_9b_v3/stage3_ko

train_file: data/processed/aihub_train.jsonl
valid_file: data/processed/aihub_valid.jsonl
en_replay_file: data/processed/ed_train.jsonl

max_length: 512
max_history: 8
batch_size: 2
grad_accum: 8
lr: 1.5e-4
share_lr_scale: 0.5
weight_decay: 0.01
num_epochs: 1
max_steps: null
eval_every: 200
max_eval_batches: 100
log_every: 10
gradient_checkpointing: false

# Base weights (SELECT further scaled by gates)
emotion_loss_weight: 0.3
strategy_loss_weight: 1.6
relation_loss_weight: 0.35

strategy_multilabel: true
deep_strategy_head: true
use_class_weights: true

# SELECT differentiators
force_init: soft_share
en_replay_every: 4
lora_anchor_weight: 0.08
gate_conditioned_losses: true
select_curriculum: true
gate_share_loss_scale: 0.85
gate_relearn_loss_scale: 1.85
gate_suppress_loss_scale: 0.8

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_include_mlp: false

seed: 42
device: cuda
