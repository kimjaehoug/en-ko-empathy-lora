# KO Stage3 SELECT v2 — accuracy upgrades for S + Dir II EN retention
model_name: Qwen/Qwen3.5-9B
dtype: bf16
stage1_lora_dir: outputs/qwen35_9b/stage1_en/lora
gates_file: outputs/qwen35_9b/stage2_gates/gates.json
output_dir: outputs/qwen35_9b_v2/stage3_ko

train_file: data/processed/aihub_train.jsonl
valid_file: data/processed/aihub_valid.jsonl
en_replay_file: data/processed/ed_train.jsonl

max_length: 512
max_history: 8
batch_size: 2
grad_accum: 8
lr: 1.5e-4
share_lr_scale: 0.5
weight_decay: 0.01
num_epochs: 1
max_steps: null
eval_every: 200
max_eval_batches: 100
log_every: 10
gradient_checkpointing: false

# Loss weights: boost S (was under-trained as single-label)
emotion_loss_weight: 0.25
strategy_loss_weight: 1.5
relation_loss_weight: 0.25

# v2 upgrades
strategy_multilabel: true
deep_strategy_head: true
use_class_weights: true
en_replay_every: 4          # every 4 KO optimizer steps, 1 EN ED replay
lora_anchor_weight: 0.05    # keep LoRA near Stage1 EN subspace
force_init: soft_share      # EN init even when gates say relearn

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_include_mlp: false

seed: 42
device: cuda
