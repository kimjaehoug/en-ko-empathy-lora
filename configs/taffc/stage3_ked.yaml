# KorEmpatheticDialogues translate-train baseline (TAFFC item 10)
model_name: Qwen/Qwen3.5-9B
dtype: bf16
stage1_lora_dir: outputs/qwen35_9b/stage1_en/lora
gates_file: outputs/qwen35_9b_v3/stage2_gates/gates.json
output_dir: outputs/taffc/qwen/KED/s42

train_file: data/processed/kor_ed_train.jsonl
valid_file: data/processed/kor_ed_valid.jsonl

max_length: 512
max_history: 8
batch_size: 2
grad_accum: 8
lr: 1.5e-4
head_lr: 1.5e-4
weight_decay: 0.01
num_epochs: 1
eval_every: 400
max_eval_batches: 100
log_every: 10

emotion_loss_weight: 0.35
strategy_loss_weight: 1.8
relation_loss_weight: 0.45
strategy_multilabel: true
strategy_scope: utterance
deep_strategy_head: true
use_class_weights: true

force_init: relearn
two_pass_affect: false
gate_conditioned_losses: false
select_curriculum: false
en_replay_every: 0
lora_anchor_weight: 0.0

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
seed: 42
device: cuda
