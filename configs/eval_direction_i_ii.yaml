# Direction I/II evaluation
model_name: gpt2
device: auto
batch_size: 2
max_length: 384
max_history: 8
max_batches: 50

stage1_dir: outputs/stage1_en
en_valid_file: data/processed/ed_valid.jsonl
ko_valid_file: data/processed/aihub_valid.jsonl
output_dir: outputs/eval_direction_i_ii

# Direction I: Stage3-style checkpoints with KO A/S/R heads
ko_checkpoints:
  select: outputs/stage3_ko
  ko_scratch: outputs/baseline_ko_scratch
  blind_share: outputs/baseline_blind_share

# Direction II: LoRA adapters evaluated with Stage1 EN emotion head on ED
en_lora_variants:
  en_before_ko: outputs/stage1_en/lora
  after_select: outputs/stage3_ko/lora
  after_ko_scratch: outputs/baseline_ko_scratch/lora
  after_blind_share: outputs/baseline_blind_share/lora
